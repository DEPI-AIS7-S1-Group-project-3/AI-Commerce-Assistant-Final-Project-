<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="دكان تك: تكنولوجيا أقرب ليك." />
    <meta name="theme-color" content="#030407" />
    <title>دكان تك | Dokkan Tech</title>
    <script>
      // Set the theme before the page paints: saved choice, otherwise the system setting.
      try {
        var t = localStorage.getItem("dokkan.theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
