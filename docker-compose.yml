services:
  db:
    image: postgres:16
    container_name: ai_commerce_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
      POSTGRES_DB: ai_commerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_commerce"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
